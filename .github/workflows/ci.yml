name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU torch, same order as the Dockerfile)
        run: |
          pip install "torch==2.11.0" "torchvision==0.26.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install --no-deps "facenet-pytorch==2.6.0"
          pip install "pytest>=8,<10" "pytest-django>=4.9,<5" "ruff>=0.6"
      - name: Lint
        run: ruff check .
      - name: Django checks
        run: |
          python manage.py check
          DJANGO_DEBUG=false DJANGO_SECRET_KEY=ci-only-not-secret DJANGO_HTTPS=true python manage.py check --deploy
      - name: "Tests (model tests skip: weights are not in the repo)"
        run: pytest

  frontend:
    name: Web UI (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: forgeguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
