name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"

jobs:
  lint:
    name: Lint (ruff, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Ruff
        run: uvx ruff@0.17.3 check .
      - name: Dead code (vulture)
        # Names below are used by Django/PyTorch/Huey/tests by name, not by direct call
        run: >-
          uvx vulture@2.14 api core scripts --min-confidence 60 --exclude "api/tests.py"
          --ignore-names "ApiConfig,Command,help,add_arguments,handle,app_name,urlpatterns,handler404,RequestIdLogFilter,RequestContextMiddleware,process_exception,forward,purge_expired_periodically,invalidate_caches"
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy api core   # settings in pyproject.toml [tool.mypy]

  test:
    name: Setup from scratch + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache model weights (keyed on the manifest hashes)
        uses: actions/cache@v6
        with:
          path: weights
          key: weights-${{ hashFiles('core/model_manifest.json') }}
      # `make setup` is exactly what the README tells a new developer to run
      - name: make setup
        run: make setup
      - name: Django checks (deploy warnings fail the build)
        env:
          DJANGO_DEBUG: "false"
          DJANGO_HTTPS: "true"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_HSTS_PRELOAD: "true"
        run: |
          # Production settings refuse to start without a real key, so generate one
          DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DJANGO_SECRET_KEY
          uv run python manage.py check
          uv run python manage.py check --deploy --fail-level WARNING
      - name: make test
        run: make test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --frozen --no-dev
      - name: pip-audit
        run: uv run --with pip-audit pip-audit
      - name: npm audit
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
      - name: npm audit (API type generator)
        working-directory: web/tools/gen-api
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        # The official image from Docker Hub, pinned by digest: does not depend on
        # GitHub release downloads (which returned 504s on 2026-11-08).
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git --redact --no-banner --config .gitleaks.toml .

  web:
    name: Web UI (unit tests, accessibility, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types are generated from api/openapi.yaml and up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api-schema.ts || {
            echo "::error::web/src/lib/api-schema.ts is stale: run 'npm run gen:api' in web/ and commit it"; exit 1; }
      - run: npm test
      - name: Accessibility and layout (Playwright + axe, every route, both themes, 375/1280 px)
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:e2e
      - run: npm run build

  docker:
    name: Docker stack (web + worker + redis) runs a real job
    runs-on: ubuntu-latest
    needs: [lint, test, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: forgeguard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: |
          docker image inspect forgeguard:latest --format '{{.Size}}' | awk '{printf "image size: %.0f MB\n", $1/1048576}'
      - name: Restore model weights
        uses: actions/cache/restore@v6
        with:
          path: weights
          key: weights-${{ hashFiles('core/model_manifest.json') }}
      - name: Fetch any weights the cache did not have
        run: python3 scripts/download_weights.py --allow-missing
      - name: Start the stack
        run: |
          # As a user would: compose reads .env for every command (up, exec, cp, logs)
          echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" > .env
          docker compose up -d --no-build
      - name: Web liveness, then readiness once the worker has loaded the video model
        run: |
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health/live && break; sleep 2; done
          for _ in $(seq 1 90); do
            curl -sS http://127.0.0.1:8000/api/health/ > health.json || true
            python3 - <<'EOF' && break
          import json, sys
          h = json.load(open("health.json"))
          sys.exit(0 if h["worker"]["alive"] and h["models"]["video"]["loaded"] else 1)
          EOF
            sleep 2
          done
          cat health.json
          # Overall 503 is expected while model_c1.pth has no public download (I7)
          python3 -c "import json; h = json.load(open('health.json')); assert h['worker']['alive'] and h['models']['video']['healthy'], h"
      - name: A real video job runs end to end in the worker
        run: |
          docker compose exec -T worker python -c "import cv2, numpy as np; w = cv2.VideoWriter('/tmp/noface.avi', cv2.VideoWriter_fourcc(*'MJPG'), 10, (160, 120)); [w.write(np.full((120, 160, 3), i * 8, np.uint8)) for i in range(20)]; w.release()"
          docker compose cp worker:/tmp/noface.avi noface.avi
          curl -sS -F "file=@noface.avi" http://127.0.0.1:8000/api/jobs/ | tee job.json
          POLL=$(python3 -c "import json; print(json.load(open('job.json'))['poll'])")
          for _ in $(seq 1 60); do
            curl -sS "http://127.0.0.1:8000$POLL" > result.json
            python3 -c "import json, sys; sys.exit(0 if json.load(open('result.json'))['status'] in ('done', 'failed') else 1)" && break
            sleep 2
          done
          cat result.json
          python3 -c "import json; r = json.load(open('result.json')); assert r['status'] == 'done' and r['result']['label'] == 'UNSURE', r"
      - name: Uploads are removed after the job; containers run as non-root
        run: |
          test "$(docker compose exec -T worker sh -c 'ls -A /var/forgeguard/uploads | wc -l')" = "0"
          test "$(docker compose exec -T web id -u)" != "0"
          test "$(docker compose exec -T worker id -u)" != "0"
      - name: Container memory
        run: docker stats --no-stream --format '{{.Name}} {{.MemUsage}}'
      - name: "Single container (FORGEGUARD_ROLE=all, as on a Hugging Face Space): downloads weights, runs a job"
        run: |
          # No weights volume, user 1000, web + worker in one container, as on a Space
          docker run -d --name fg-all --user 1000:1000 -p 8001:8000 \
            -e FORGEGUARD_ROLE=all -e FORGEGUARD_DOWNLOAD_WEIGHTS=true \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            forgeguard:latest
          for _ in $(seq 1 150); do
            curl -sS http://127.0.0.1:8001/api/health/ > health-all.json 2>/dev/null || true
            python3 -c "import json, sys; h = json.load(open('health-all.json')); sys.exit(0 if h['worker']['alive'] and h['models']['video']['loaded'] else 1)" 2>/dev/null && break
            sleep 4
          done
          cat health-all.json
          curl -sS -F "file=@noface.avi" http://127.0.0.1:8001/api/jobs/ | tee job-all.json
          POLL=$(python3 -c "import json; print(json.load(open('job-all.json'))['poll'])")
          for _ in $(seq 1 60); do
            curl -sS "http://127.0.0.1:8001$POLL" > result-all.json
            python3 -c "import json, sys; sys.exit(0 if json.load(open('result-all.json'))['status'] in ('done', 'failed') else 1)" && break
            sleep 2
          done
          cat result-all.json
          python3 -c "import json; r = json.load(open('result-all.json')); assert r['status'] == 'done' and r['result']['label'] == 'UNSURE', r"
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' fg-all
      - name: Single-container logs
        if: always()
        run: docker logs fg-all 2>&1 | tail -100 || true
      - name: Stack logs
        if: always()
        run: docker compose logs --no-color
