name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"

jobs:
  lint:
    name: Lint (ruff, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Ruff
        run: uvx ruff@0.17.3 check .
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  typecheck:
    name: Typecheck (mypy, not yet blocking)
    runs-on: ubuntu-latest
    # 13 known errors; made blocking in remediation phase 4 (docs/remediation.md)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy api core --ignore-missing-imports --explicit-package-bases

  test:
    name: Setup from scratch + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache model weights (keyed on the manifest hashes)
        uses: actions/cache@v6
        with:
          path: weights
          key: weights-${{ hashFiles('core/model_manifest.json') }}
      # `make setup` is exactly what the README tells a new developer to run
      - name: make setup
        run: make setup
      - name: Django checks (deploy warnings fail the build)
        env:
          DJANGO_DEBUG: "false"
          DJANGO_HTTPS: "true"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_HSTS_PRELOAD: "true"
        run: |
          # Production settings refuse to start without a real key, so generate one
          DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DJANGO_SECRET_KEY
          uv run python manage.py check
          uv run python manage.py check --deploy --fail-level WARNING
      - name: make test
        run: make test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --frozen --no-dev
      - name: pip-audit
        # Accepted, build-time only: setuptools <82 is capped by torch 2.11.
        # Justification and review date in SECURITY.md.
        run: >-
          uv run --with pip-audit pip-audit
          --ignore-vuln PYSEC-2026-3447
          --ignore-vuln GHSA-xmj3-9gf7-h52w
      - name: npm audit
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml .

  web:
    name: Web UI (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker image builds, runs and passes its health check
    runs-on: ubuntu-latest
    needs: [lint, test, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: forgeguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: |
          docker image inspect forgeguard:ci --format '{{.Size}}' | awk '{printf "image size: %.0f MB\n", $1/1048576}'
      - name: Restore model weights
        uses: actions/cache/restore@v6
        with:
          path: weights
          key: weights-${{ hashFiles('core/model_manifest.json') }}
      - name: Fetch any weights the cache did not have
        run: python3 scripts/download_weights.py --allow-missing
      - name: Run the container
        run: |
          docker run -d --name fg -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-only-not-secret \
            -v "$PWD/weights:/app/weights:ro" forgeguard:ci
      - name: Liveness and readiness
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/health/live && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health/live
          # 503 is expected while model_c1.pth has no public download (I7)
          curl -sS http://127.0.0.1:8000/api/health/ | tee health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['models']['video']['healthy'], h"
      - name: Runs as non-root
        run: test "$(docker exec fg id -u)" != "0"
      - name: Container logs
        if: always()
        run: docker logs fg
