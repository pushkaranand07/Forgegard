version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node 22 LTS line; odd majors (25) are not LTS
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web/tools/gen-api
    schedule:
      interval: weekly
    ignore:
      # openapi-typescript needs the TypeScript 5 JS API (the app itself is on 7)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
