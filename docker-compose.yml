# Local production-like run:
#   cp .env.example .env    # set DJANGO_SECRET_KEY, DJANGO_DEBUG=false
#   docker compose up --build
#   open http://localhost:8000
services:
  forgeguard:
    build: .
    image: forgeguard:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}"
    volumes:
      - ./weights:/app/weights:ro
    restart: unless-stopped
    # Measured: ~0.9 GB idle with both models loaded, ~1.7 GB peak per video job
    mem_limit: 3g
